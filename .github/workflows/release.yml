name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check formatting and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Match release tag to VERSION
        if: inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: test "$RELEASE_TAG" = "v$(tr -d '\r\n' < VERSION)"
      - name: Install Skia system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential pkg-config libfontconfig1-dev libfreetype6-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test workspace
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Install Skia system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential pkg-config libfontconfig1-dev libfreetype6-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  build:
    name: Build ${{ matrix.asset }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            asset: wive-linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
            asset: wive-windows-x86_64.exe
          - os: macos-latest
            platform: macos-universal
            asset: wive-macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Install Linux Skia system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential pkg-config libfontconfig1-dev libfreetype6-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'macOS'
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'macOS'
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build Linux and Windows binary
        if: runner.os != 'macOS'
        run: cargo build --release --locked -p wive-desktop
      - name: Build universal macOS binary
        if: runner.os == 'macOS'
        run: |
          cargo build --release --locked -p wive-desktop --target aarch64-apple-darwin
          cargo build --release --locked -p wive-desktop --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create \
            target/aarch64-apple-darwin/release/wive \
            target/x86_64-apple-darwin/release/wive \
            -output "dist/${{ matrix.asset }}"
      - name: Stage Linux and Windows binary
        if: runner.os != 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/wive${{ runner.os == 'Windows' && '.exe' || '' }}" "dist/${{ matrix.asset }}"
      - name: Build Linux Debian installer
        if: runner.os == 'Linux'
        env:
          WIVE_VERSION: ${{ inputs.release_tag && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${WIVE_VERSION#v}"
          package_root="build/deb-root"
          mkdir -p "$package_root/DEBIAN" \
            "$package_root/usr/bin" \
            "$package_root/usr/share/applications" \
            "$package_root/usr/share/icons/hicolor/scalable/apps" \
            "$package_root/usr/share/doc/wive"
          install -m 0755 target/release/wive "$package_root/usr/bin/wive"
          install -m 0644 packaging/linux/wive.desktop "$package_root/usr/share/applications/wive.desktop"
          install -m 0644 assets/wive-icon.svg "$package_root/usr/share/icons/hicolor/scalable/apps/wive.svg"
          install -m 0644 LICENSE "$package_root/usr/share/doc/wive/LICENSE"
          install -m 0644 assets/icons/LICENSE "$package_root/usr/share/doc/wive/Lucide-LICENSE"
          sed "s/@VERSION@/$version/" packaging/linux/control > "$package_root/DEBIAN/control"
          dpkg-deb --build --root-owner-group "$package_root" dist/wive-linux-x86_64.deb
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:WIVE_VERSION = (Get-Content VERSION -Raw).Trim()
          choco install innosetup --yes --no-progress
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler was not installed at $compiler"
          }
          & $compiler ".\packaging\windows\wive.iss"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
      - name: Package macOS application and disk image
        if: runner.os == 'macOS'
        env:
          WIVE_VERSION: ${{ inputs.release_tag && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${WIVE_VERSION#v}"
          app="build/Wive.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          brew install librsvg
          install -m 0755 "dist/${{ matrix.asset }}" "$app/Contents/MacOS/wive"
          sed "s/@VERSION@/$version/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          iconset="build/Wive.iconset"
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            doubled=$((size * 2))
            rsvg-convert -w "$size" -h "$size" assets/wive-icon.svg \
              -o "$iconset/icon_${size}x${size}.png"
            rsvg-convert -w "$doubled" -h "$doubled" assets/wive-icon.svg \
              -o "$iconset/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/Wive.icns"
          cp assets/icons/LICENSE "$app/Contents/Resources/Lucide-LICENSE"
          hdiutil create \
            -volname Wive \
            -srcfolder "$app" \
            -ov \
            -format UDZO \
            "dist/Wive-macos-universal.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: wive-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: wive-*
          path: release-assets
          merge-multiple: true
      - name: Include third-party icon license notice
        run: cp assets/icons/LICENSE release-assets/THIRD_PARTY_NOTICES-lucide.txt
      - name: Generate SHA-256 manifest
        run: cd release-assets && sha256sum -- * > SHA256SUMS
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-assets/* --title "Wive $RELEASE_TAG" --generate-notes --verify-tag --repo "$GH_REPO"
